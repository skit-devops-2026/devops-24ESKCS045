events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location = /stub_status {
            stub_status;
            access_log off;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}